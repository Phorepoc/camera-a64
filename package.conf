# package.conf -- how the pdk's package.yml builds this repository's SIS file (release.yml): the A64 camera drivers
# (sun6i-csi, ov5640, gc2145, i2c-gpio from Linux) as a loadable camera PDD, plus the ECam plugin over it.
# Not wired yet: COMPONENTS stays empty until glue/ (the PDD) and the plugin exist; recipes/build.sh is the build today.
NAME=camera-a64
ARCHES="arm"
COMPONENTS_arm=""
