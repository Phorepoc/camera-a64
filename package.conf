# package.conf -- how the pdk's package.yml builds this repository's SIS file (release.yml): the A64 camera drivers
# from Linux (sun6i-csi, ov5640, gc2145, i2c-gpio + the V4L2 core) as a user-side camera server, plus the ECam
# plug-in that talks to it. recipes/prebuild.sh builds the Linux stack; the components link it.
NAME=camera-a64
ARCHES="arm"
# adaptation-a64: the image's CamHw.A64 channel header the server is built against
REPOS_arm="adaptation-a64"
COMPONENTS_arm="phecamserver_arm phecama64_arm"
